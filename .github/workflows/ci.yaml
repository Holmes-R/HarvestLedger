name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: harvestledger_ci
          POSTGRES_USER: harvestledger_ci
          POSTGRES_PASSWORD: ci-local-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harvestledger_ci -d harvestledger_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-long-random-placeholder-never-used-for-hosting-2026
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      PGDATABASE: harvestledger_ci
      PGTESTDATABASE: harvestledger_ci_test
      PGUSER: harvestledger_ci
      PGPASSWORD: ci-local-only-password
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGSSLMODE: disable
      PGCHANNELBINDING: disable
      ALLOW_REVIEW_CLOCK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install declared backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Ruff lint and format
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: Django checks and migration drift
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Production settings check
        working-directory: backend
        env:
          DEBUG: "false"
          ALLOWED_HOSTS: localhost
        run: python manage.py check --deploy
      - name: Backend regression suite on isolated PostgreSQL
        working-directory: backend
        run: python -m pytest -q -ra
      - name: Collect Django static assets
        working-directory: backend
        run: python manage.py collectstatic --noinput
      - name: Generate and validate OpenAPI schema
        working-directory: backend
        run: |
          python manage.py spectacular --file /tmp/harvestledger-schema.yaml --validate
          python -c "import yaml; schema=yaml.safe_load(open('/tmp/harvestledger-schema.yaml')); assert '/api/v1/health/' in schema['paths']"
      - name: Validate Render blueprint structure
        run: |
          python -c "import yaml; data=yaml.safe_load(open('render.yaml')); services=data['services']; assert {s['runtime'] for s in services} == {'python', 'static'}; assert any(s.get('healthCheckPath') == '/health/' for s in services)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend component tests
        working-directory: frontend
        run: npm test -- --maxWorkers=2 --no-file-parallelism
      - name: Type check
        working-directory: frontend
        run: npx tsc -b --pretty false
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Production build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api/v1
        run: npm run build
