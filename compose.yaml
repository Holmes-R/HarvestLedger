services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-harvestledger_dev}
      POSTGRES_USER: ${POSTGRES_USER:-harvestledger_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the root .env file}
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      PGDATABASE: ${POSTGRES_DB:-harvestledger_dev}
      PGTESTDATABASE: harvestledger_test
      PGUSER: ${POSTGRES_USER:-harvestledger_local}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      PGHOST: db
      PGPORT: "5432"
      PGSSLMODE: disable
      PGCHANNELBINDING: disable
      ALLOW_REVIEW_CLOCK: "false"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "bash scripts/migrate_and_seed.sh &&
      exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --access-logfile - --error-logfile -"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
